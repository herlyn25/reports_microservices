server:
  port: 8082
spring:
  application:
    name: "reportsCrediya"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
entrypoint:
  sqs:
    region: "${AWS_REGION}"
    endpoint: "${AWS_ENDPOINT}"
    queueUrl: "${AWS_QUEUE_URL}"
    waitTimeSeconds: 20
    maxNumberOfMessages: 10
    visibilityTimeoutSeconds: 10
    numberOfThreads: 1
    credentials:
      access-key: "${AWS_ACCESS_KEY_ID}"
      secret-key: "${AWS_SECRET_ACCESS_KEY}"

jwt:
  secret-key: "${JWT_SECRET_KEY:$mySecretKeyForJWT2024VeryLongAndSecureKey123456789}"
  expiration: 3600000
